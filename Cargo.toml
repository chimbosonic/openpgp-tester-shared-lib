[package]
name = "openpgp-tester-lib"
version = "0.1.0"
edition = "2024"


[dependencies]
sha2 = "0.11.1"
hex = "0.4.3"
miette = "7.6.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
pgp = {version = "0.21.0", features = ["bzip2", "asm", "large-rsa", "pqc"]}
chrono = "0.4.45"
tracing = { version = "0.1.44", optional = true }
bytes = "1.12.1"

[features]
tracing = ["dep:tracing"]
